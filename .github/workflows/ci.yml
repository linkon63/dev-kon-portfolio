name: CI

# Validates every pull request and every push to `dev` BEFORE it can be deployed.
# Runs lint + a production build so a broken commit never reaches the VPS.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Cancel superseded runs on the same ref (e.g. force-push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` runs `postinstall` → `prisma generate`, so the client exists.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Production build. A dummy DATABASE_URL is enough because the build only
      # generates the Prisma client and compiles — it does not connect to the DB.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: ci-placeholder
          ADMIN_SESSION_SECRET: ci-placeholder-secret-not-used-at-runtime
